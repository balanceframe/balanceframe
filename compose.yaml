# =============================================================================
# BalanceFrame — canonical Docker Compose deployment
# =============================================================================
# This manifest deploys BalanceFrame as a sidecar to an existing Actual Budget
# server.  Actual remains independently usable, upgradeable, and removable.
#
# Network: By default the service attaches to an external shared network
# (`balanceframe-net`) so it can reach Actual Budget by service name.  Create
# the network once:
#
#   docker network create balanceframe-net
#
# Then add to your Actual Budget compose.yaml:
#
#   networks:
#     default:
#       external: true
#       name: balanceframe-net
#
# If Actual runs outside Docker (PikaPods, Fly.io, LAN, etc.), set the
# ACTUAL_SERVER_URL environment variable instead.
#
# Usage:
#   cp .env.example .env      # configure secrets and ports
#   docker compose up -d      # start BalanceFrame
#   docker compose pull       # upgrade BalanceFrame
#
# See docs/releases.md for the SemVer and upgrade policy.
# =============================================================================

services:
  balanceframe:
    image: ${BALANCEFRAME_IMAGE_REF:?required}
    restart: unless-stopped
    ports:
      - "${BALANCEFRAME_PORT:-3030}:3000"
    volumes:
      - balanceframe-data:/data
    environment:
      - NUXT_AUTH_DB_PATH=/data/auth.db
      - ACTUAL_SERVER_URL=${ACTUAL_SERVER_URL:-http://actual_server:5006}
      - ACTUAL_SECRET_KEY=${ACTUAL_SECRET_KEY:?required}
      - BALANCEFRAME_WORKFLOW_DB_PATH=/data/workflow.db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?required}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?required}
      - BALANCEFRAME_BOOTSTRAP_SECRET_FILE=/run/secrets/bootstrap_secret
    secrets:
      - bootstrap_secret
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    external: true
    name: balanceframe-net

volumes:
  balanceframe-data:
secrets:
  bootstrap_secret:
    file: ./bootstrap_secret.txt
